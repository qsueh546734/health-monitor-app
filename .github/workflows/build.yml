name: build

# 本机没有 Android SDK，所以编译必须在云端做。
# 但纯 Java 部分（协议解析、状态机、模拟器）在本地用裸 javac 就能秒级验证，
# 这里再跑一遍是为了保证"本地绿"不等于"只有本地绿"。
#
# 注意：本工作流不用 gradle wrapper（本机没有 Gradle 生成不了 wrapper jar），
# 由 setup-gradle 提供。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Run all local gates
        # 与本地完全同一条命令。
        #
        # 这里曾经是硬编码的类名清单，结果加了 DbSchema 之后本地绿、CI 红；
        # 后来又因为"XML 注释里出现 --"连挂两次 —— 那个错本地 1 秒能查出来，
        # 只是当时没有一个检查器为"XML 本身是否合法"负责。
        #
        # 现在五道门都在 check-all.js 里（XML / 资源引用 / 类型检查 / 纯 Java 测试 / 固件），
        # CI 直接调它。于是"本地全过"就等于"CI 这一步也会过"。
        run: node tools/check-all.js

      - name: Build debug APK
        # --stacktrace 让失败时的日志足够定位，不用重跑一次。
        #
        # 关键：把构建输出 tee 到 diag/ 里。构建日志端点需要鉴权，
        # 而失败时偏偏最需要它 —— 不落盘的话就只能让用户去网页上翻。
        # set -o pipefail 保证 tee 不会把 gradle 的失败退出码吞掉。
        run: |
          set -o pipefail
          mkdir -p diag
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee diag/build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 把诊断信息也写出来：构建日志通常要登录才能看，而失败时偏偏最需要它。
      # 让 CI 自己把证据（版本、大小、SHA-256）产出来，成或败都能被读到。
      - name: Write public diagnostics
        if: always()
        run: |
          mkdir -p diag
          APK=app/build/outputs/apk/debug/app-debug.apk
          {
            echo "run:        ${{ github.run_number }}"
            echo "commit:     ${{ github.sha }}"
            echo "generated:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -f "$APK" ]; then
              echo "apk_bytes:  $(stat -c%s "$APK")"
              echo "apk_sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            else
              echo "apk:        NOT PRODUCED"
            fi
          } > diag/build-info.txt
          cat diag/build-info.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: diag/
          retention-days: 90
