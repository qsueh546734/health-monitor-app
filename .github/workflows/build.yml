name: build

# 本机没有 Android SDK，所以编译必须在云端做。
# 但纯 Java 部分（协议解析、状态机、模拟器）在本地用裸 javac 就能秒级验证，
# 这里再跑一遍是为了保证"本地绿"不等于"只有本地绿"。
#
# 注意：本工作流不用 gradle wrapper（本机没有 Gradle 生成不了 wrapper jar），
# 由 setup-gradle 提供。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Run pure-Java tests
        # 这些类不依赖 android.*，所以不需要 Android SDK 就能编译运行。
        # 本地用 tools/run-tests.ps1 跑同一批测试。
        run: |
          set -e
          if [ ! -d tools/tests ]; then
            echo "no pure-Java tests yet"
            exit 0
          fi
          SRC=app/src/main/java/com/example/healthmon
          mkdir -p tools/out
          PURE=""
          for f in Frame Protocol LineAssembler AppState Simulator ChartData Auth; do
            [ -f "$SRC/$f.java" ] && PURE="$PURE $SRC/$f.java"
          done
          if [ -z "$PURE" ]; then
            echo "no pure-Java sources yet"
            exit 0
          fi
          javac -encoding UTF-8 -d tools/out $PURE tools/tests/*.java
          FAILED=0
          for t in tools/tests/*Test.java; do
            [ -e "$t" ] || continue
            name=$(basename "$t" .java)
            echo "== $name =="
            java -cp tools/out "$name" || FAILED=1
          done
          exit $FAILED

      - name: Build debug APK
        # --stacktrace 让失败时的日志足够定位，不用重跑一次
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 把诊断信息也写出来：构建日志通常要登录才能看，而失败时偏偏最需要它。
      # 让 CI 自己把证据（版本、大小、SHA-256）产出来，成或败都能被读到。
      - name: Write public diagnostics
        if: always()
        run: |
          mkdir -p diag
          APK=app/build/outputs/apk/debug/app-debug.apk
          {
            echo "run:        ${{ github.run_number }}"
            echo "commit:     ${{ github.sha }}"
            echo "generated:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -f "$APK" ]; then
              echo "apk_bytes:  $(stat -c%s "$APK")"
              echo "apk_sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            else
              echo "apk:        NOT PRODUCED"
            fi
          } > diag/build-info.txt
          cat diag/build-info.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: diag/
          retention-days: 90
